# Firebase App Hosting config. Docs: https://firebase.google.com/docs/app-hosting/configure
runConfig:
  minInstances: 0
  maxInstances: 1

env:
  # Frontend build-time var (Vite bakes this into the bundle at build time).
  - variable: VITE_API_URL
    value: /api

  # Non-secret runtime config.
  - variable: GOOGLE_CALENDAR_ID
    value: varunvaibhav06@gmail.com
  - variable: CLINIC_TIMEZONE
    value: Asia/Kolkata
  - variable: GOOGLE_OAUTH_CLIENT_ID
    value: 600377782029-jfqeujt7kqkf8t66tkqog57lsqlutbjt.apps.googleusercontent.com
  - variable: RAZORPAY_KEY_ID
    value: rzp_test_TXtyVXH08uaxzi

  # Separate client, used only for the "Sign in with Google" button
  # (ID-token verification) — not the Calendar admin-connect flow above.
  - variable: GOOGLE_SIGNIN_CLIENT_ID
    value: 600377782029-sknmd9g9s1i83boucemmcn1v2cgfet8q.apps.googleusercontent.com
  - variable: VITE_GOOGLE_CLIENT_ID
    value: 600377782029-sknmd9g9s1i83boucemmcn1v2cgfet8q.apps.googleusercontent.com

  - variable: FRONTEND_URL
    value: https://deivayanaipetclinic.online
  - variable: GOOGLE_OAUTH_REDIRECT_URI
    value: https://deivayanaipetclinic.online/api/google/oauth/callback

  # Secrets — set once via `firebase apphosting:secrets:set <NAME>`, then
  # referenced here by name. Never put the actual values in this file.
  - variable: DATABASE_URL
    secret: DATABASE_URL
  - variable: JWT_SECRET
    secret: JWT_SECRET
  - variable: GOOGLE_OAUTH_CLIENT_SECRET
    secret: GOOGLE_OAUTH_CLIENT_SECRET
  - variable: RESEND_API_KEY
    secret: RESEND_API_KEY
  - variable: RAZORPAY_KEY_SECRET
    secret: RAZORPAY_KEY_SECRET
